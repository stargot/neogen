[package]
name = "neogen-script"
version = "0.1.0"
edition = "2024"
description = "Lua 5.4 runtime for player scripts on top of neogen-core."
publish = false

[dependencies]
# Exact pin on purpose: a Lua runtime bump changes script semantics —
# dependency changes are a user gate (see backlog conventions).
mlua = { version = "=0.12.1", features = ["lua54", "vendored"] }
