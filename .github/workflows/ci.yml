name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  godot:
    name: Godot 4.7.2 (headless extension check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download Godot 4.7.2
        run: |
          curl -fL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Build GDExtension
        run: |
          cargo build -p neogen-gdext --release
          cp target/release/libneogen_gdext.so \
            godot/bin/libneogen_gdext.linux.x86_64.so

      - name: Register GDExtension (editor import)
        # Known Godot 4.7.2 + gdext 0.5.5 issue: a headless editor import
        # with a class-registering extension segfaults at process exit,
        # AFTER writing .godot/extension_list.cfg. The crash is harmless
        # for us; the next step proves the extension loads cleanly.
        working-directory: godot
        run: |
          set +e
          ../Godot_v4.7.2-stable_linux.x86_64 --headless --import
          code=$?
          set -e
          if [ $code -ne 0 ] && [ $code -ne 139 ]; then exit $code; fi

      - name: Headless check (extension must load)
        working-directory: godot
        run: |
          set -o pipefail
          ../Godot_v4.7.2-stable_linux.x86_64 --headless --quit 2>&1 | tee /tmp/godot-run.log
          grep -q "Neogen GDExtension loaded" /tmp/godot-run.log
          # Deliberate tripwire (review #8): any error/failed line in the
          # headless run fails the job - do not loosen without a reason.
          ! grep -qiE "error|failed" /tmp/godot-run.log

      - name: Smoke test (bridge, editor, HUD, mirror)
        working-directory: godot
        run: |
          set -o pipefail
          ../Godot_v4.7.2-stable_linux.x86_64 --headless --script res://tests/smoke.gd 2>&1 | tee /tmp/smoke.log
          grep -q "SMOKE OK" /tmp/smoke.log

      - name: Boot check (real main scene, no errors)
        working-directory: godot
        run: |
          set -o pipefail
          ../Godot_v4.7.2-stable_linux.x86_64 --headless --quit-after 180 2>&1 | tee /tmp/boot.log
          ! grep -qE "SCRIPT ERROR|Node not found|no SimNode|Invalid call|Invalid access|Invalid assignment" /tmp/boot.log
          grep -q "Neogen shell ready" /tmp/boot.log

      - name: Scene integration (live main.tscn wiring)
        working-directory: godot
        run: |
          set -o pipefail
          ../Godot_v4.7.2-stable_linux.x86_64 --headless --script res://tests/scene_integration.gd 2>&1 | tee /tmp/scene.log
          grep -q "SCENE INTEGRATION OK" /tmp/scene.log

      - name: Facade determinism (ground_gen from core seed)
        working-directory: godot
        run: |
          set -o pipefail
          ../Godot_v4.7.2-stable_linux.x86_64 --headless --script res://tests/facade_determinism.gd 2>&1 | tee /tmp/facade.log
          grep -q "FACADE DETERMINISM OK" /tmp/facade.log
